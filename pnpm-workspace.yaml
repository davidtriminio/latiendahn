packages:
  - frontend

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false

# Permitir que estas dependencias ejecuten sus scripts de build (binarios nativos) durante la
# instalacion. pnpm 10+ los bloquea por defecto; aqui se aprueban para que 'pnpm install' no falle.
onlyBuiltDependencies:
  - "@parcel/watcher"
  - esbuild
  - lmdb
  - msgpackr-extract
