services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-latiendahn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-latiendahn}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Descomenta cuando actives mensajeria (Outbox -> RabbitMQ) ---
  # rabbitmq:
  #   image: rabbitmq:4-management-alpine
  #   ports: ["5672:5672", "15672:15672"]

volumes:
  postgres-data: